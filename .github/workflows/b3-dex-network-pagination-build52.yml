name: B3 DEX Network Pagination Build 52

on:
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/dex_launch_sources.py"
      - "b3_trader/tests/test_dex_network_pagination_build52.py"
      - "scripts/check-dex-network-pagination-build52.py"
      - "scripts/verify-dex-network-pagination-build52.py"
      - ".github/workflows/b3-dex-network-pagination-build52.yml"
  pull_request:
    branches:
      - master
    paths:
      - "b3_trader/dex_launch_sources.py"
      - "b3_trader/tests/test_dex_network_pagination_build52.py"
      - "scripts/check-dex-network-pagination-build52.py"
      - "scripts/verify-dex-network-pagination-build52.py"
      - ".github/workflows/b3-dex-network-pagination-build52.yml"

jobs:
  build52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile network pagination patch
        run: >-
          python -m py_compile
          b3_trader/dex_launch_sources.py
          scripts/check-dex-network-pagination-build52.py
          scripts/verify-dex-network-pagination-build52.py
      - name: Direct Build 52 verifier import bootstrap
        run: python scripts/verify-dex-network-pagination-build52.py --import-check
      - name: Build 52 network pagination unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_network_pagination_build52.py b3_trader/tests/test_dex_launch_build42.py
      - name: Build 42 regression contract
        run: python scripts/check-dex-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 regression contract
        run: python scripts/check-dex-cloud-projection-build44.py
      - name: Build 45 regression contract
        run: python scripts/check-dex-quality-build45.py
      - name: Build 46 regression contract
        run: python scripts/check-dex-backfill-build46.py
      - name: Build 47 regression contract
        run: python scripts/check-historical-listing-build47.py
      - name: Build 48 regression contract
        run: python scripts/check-listing-accelerator-build48.py
      - name: Build 49 regression contract
        run: python scripts/check-research-pipeline-build49.py
      - name: Build 50 regression contract
        run: python scripts/check-dex-sample-audit-build50.py
      - name: Build 51 regression contract
        run: python scripts/check-dex-diversity-build51.py
      - name: Build 52 pagination contract
        run: python scripts/check-dex-network-pagination-build52.py
      - name: Build 52 synthetic pagination runtime
        run: python scripts/verify-dex-network-pagination-build52.py
