name: B3 listing Viewer Build 40

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/listing_history_snapshot.py"
      - "b3_trader/cloudflare_snapshot_lifecycle.py"
      - "b3_trader/tests/test_listing_history_snapshot.py"
      - "cloudflare-pages/functions/api/ingest.ts"
      - "cloudflare-pages/public/index.html"
      - "cloudflare-pages/public/modules/main.js"
      - "cloudflare-pages/public/modules/pages/research.js"
      - "cloudflare-pages/public/modules/styles/research.css"
      - "scripts/check-listing-viewer-build40.py"
      - "scripts/verify-listing-viewer-build40.py"
      - ".github/workflows/b3-listing-viewer-build40.yml"
  workflow_dispatch:

jobs:
  build40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile compact projection
        run: >-
          python -m py_compile
          b3_trader/listing_history_snapshot.py
          b3_trader/cloudflare_snapshot_lifecycle.py
          scripts/check-listing-viewer-build40.py
          scripts/verify-listing-viewer-build40.py
      - name: Compact projection tests
        run: python -m pytest -q b3_trader/tests/test_listing_history_snapshot.py
      - name: Build 40 contract
        run: python scripts/check-listing-viewer-build40.py
      - name: Local snapshot budget check
        run: python scripts/verify-listing-viewer-build40.py
      - name: Viewer JavaScript syntax
        run: |
          node --check cloudflare-pages/public/modules/pages/research.js
          node --check cloudflare-pages/public/modules/main.js
      - name: Cloudflare Pages typecheck
        working-directory: cloudflare-pages
        run: |
          npm install
          npm run typecheck
