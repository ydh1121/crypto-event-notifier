name: B3 DEX Diversity Build 51

on:
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/dex_diversity_backfill.py"
      - "b3_trader/tests/test_dex_diversity_backfill.py"
      - "scripts/check-dex-diversity-build51.py"
      - "scripts/verify-dex-diversity-build51.py"
      - ".github/workflows/b3-dex-diversity-build51.yml"
  pull_request:
    branches:
      - master
    paths:
      - "b3_trader/dex_diversity_backfill.py"
      - "b3_trader/tests/test_dex_diversity_backfill.py"
      - "scripts/check-dex-diversity-build51.py"
      - "scripts/verify-dex-diversity-build51.py"
      - ".github/workflows/b3-dex-diversity-build51.yml"

jobs:
  build51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile diversity backfill
        run: python -m py_compile b3_trader/dex_diversity_backfill.py scripts/verify-dex-diversity-build51.py
      - name: Direct diversity verifier import bootstrap
        run: python scripts/verify-dex-diversity-build51.py --import-check
      - name: Diversity unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_diversity_backfill.py b3_trader/tests/test_dex_launch_backfill.py b3_trader/tests/test_dex_launch_quality.py
      - name: Build 42 regression contract
        run: python scripts/check-dex-launch-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 regression contract
        run: python scripts/check-dex-cloudflare-build44.py
      - name: Build 45 regression contract
        run: python scripts/check-dex-quality-build45.py
      - name: Build 46 regression contract
        run: python scripts/check-dex-backfill-build46.py
      - name: Build 47 regression contract
        run: python scripts/check-historical-listing-build47.py
      - name: Build 48 regression contract
        run: python scripts/check-listing-accelerator-build48.py
      - name: Build 49 regression contract
        run: python scripts/check-research-pipeline-build49.py
      - name: Build 50 regression contract
        run: python scripts/check-dex-sample-audit-build50.py
      - name: Build 51 diversity contract
        run: python scripts/check-dex-diversity-build51.py
