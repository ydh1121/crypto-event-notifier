name: B3 DEX Sample Audit Build 50

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/dex_sample_audit.py"
      - "b3_trader/tests/test_dex_sample_audit_build50.py"
      - "b3_trader/dex_launch_quality.py"
      - "b3_trader/research_pipeline_accelerator.py"
      - "scripts/check-dex-build42.py"
      - "scripts/check-dex-supervisor-build43.py"
      - "scripts/check-dex-cloud-projection-build44.py"
      - "scripts/check-dex-quality-build45.py"
      - "scripts/check-dex-backfill-build46.py"
      - "scripts/check-historical-listing-build47.py"
      - "scripts/check-listing-accelerator-build48.py"
      - "scripts/check-research-pipeline-build49.py"
      - "scripts/check-dex-sample-audit-build50.py"
      - "scripts/verify-dex-sample-audit-build50.py"
      - ".github/workflows/b3-dex-sample-audit-build50.yml"
  workflow_dispatch:

jobs:
  build50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile DEX sample audit
        run: >-
          python -m py_compile
          b3_trader/dex_sample_audit.py
          scripts/check-dex-sample-audit-build50.py
          scripts/verify-dex-sample-audit-build50.py
      - name: Direct DEX sample audit verifier import bootstrap
        run: python scripts/verify-dex-sample-audit-build50.py --import-check
      - name: DEX sample audit unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_sample_audit_build50.py
      - name: Build 42 regression contract
        run: python scripts/check-dex-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 regression contract
        run: python scripts/check-dex-cloud-projection-build44.py
      - name: Build 45 regression contract
        run: python scripts/check-dex-quality-build45.py
      - name: Build 46 regression contract
        run: python scripts/check-dex-backfill-build46.py
      - name: Build 47 regression contract
        run: python scripts/check-historical-listing-build47.py
      - name: Build 48 regression contract
        run: python scripts/check-listing-accelerator-build48.py
      - name: Build 49 regression contract
        run: python scripts/check-research-pipeline-build49.py
      - name: Build 50 DEX sample audit contract
        run: python scripts/check-dex-sample-audit-build50.py
