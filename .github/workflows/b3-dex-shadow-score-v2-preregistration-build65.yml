name: B3 DEX Shadow Score V2 Preregistration Build65

on:
  push:
    branches: [b3-auto-trader-phase1]
    paths:
      - "b3_trader/dex_shadow_score_v2_preregistration.py"
      - "b3_trader/tests/test_dex_shadow_score_v2_preregistration_build65.py"
      - "scripts/check-dex-shadow-score-v2-preregistration-build65.py"
      - "scripts/verify-dex-shadow-score-v2-preregistration-build65.py"
      - ".github/workflows/b3-dex-shadow-score-v2-preregistration-build65.yml"
  pull_request:
    paths:
      - "b3_trader/dex_shadow_score_v2_preregistration.py"
      - "b3_trader/tests/test_dex_shadow_score_v2_preregistration_build65.py"
      - "scripts/check-dex-shadow-score-v2-preregistration-build65.py"
      - "scripts/verify-dex-shadow-score-v2-preregistration-build65.py"
      - ".github/workflows/b3-dex-shadow-score-v2-preregistration-build65.yml"

jobs:
  build65:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile Build 65
        run: python -m py_compile b3_trader/dex_shadow_score_v2_preregistration.py scripts/check-dex-shadow-score-v2-preregistration-build65.py scripts/verify-dex-shadow-score-v2-preregistration-build65.py
      - name: Direct Build 65 verifier import bootstrap
        run: python scripts/verify-dex-shadow-score-v2-preregistration-build65.py --import-check
      - name: Build 65 preregistration unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_shadow_score_v2_preregistration_build65.py
      - name: Build 62 regression contract
        run: python scripts/check-dex-shadow-score-build62.py
      - name: Build 63 regression contract
        run: python scripts/check-dex-shadow-score-validation-build63.py
      - name: Build 64 regression contract
        run: python scripts/check-dex-shadow-score-failure-diagnostic-build64.py
      - name: Build 65 preregistration contract
        run: python scripts/check-dex-shadow-score-v2-preregistration-build65.py
