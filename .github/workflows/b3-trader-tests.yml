name: B3 trader tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "docs/workstreams/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "cloudflare/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "docs/workstreams/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "cloudflare/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: test -s dashboard/index.html
      - run: test -s dashboard/app.js
      - run: test -s dashboard/plain-language.js
      - run: test -s dashboard/portfolio-tools.js
      - run: test -s dashboard/ux-stability.js
      - run: test -s dashboard/styles.css
      - run: test -s dashboard/plain-language.css
      - run: test -s dashboard/portfolio-tools.css
      - run: test -s dashboard/ux-polish.css
      - run: node --check dashboard/app.js
      - run: node --check dashboard/plain-language.js
      - run: node --check dashboard/portfolio-tools.js
      - run: node --check dashboard/ux-stability.js
      - run: grep -q 'data-view-panel="overview"' dashboard/index.html
      - run: grep -q 'data-view-panel="performance"' dashboard/index.html
      - run: grep -q 'plain-language.js' dashboard/index.html
      - run: grep -q 'portfolio-tools.js' dashboard/index.html
      - run: grep -q 'ux-stability.js' dashboard/index.html
      - run: grep -q 'ux-polish.css' dashboard/index.html
      - run: grep -q 'Phone access' dashboard/index.html

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
