name: B3 trader tests

on:
  pull_request:
    paths:
      - "b3_trader/**"
      - ".github/workflows/b3-trader-tests.yml"
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/**"
      - ".github/workflows/b3-trader-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: pytest -q b3_trader/tests
        env:
          PYTHONPATH: .
