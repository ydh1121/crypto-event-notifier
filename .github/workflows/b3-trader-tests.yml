name: B3 trader tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "docs/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "cloudflare/**"
      - "cloudflare-pages/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"
      - ".github/workflows/deploy-pages-viewer.yml"
  workflow_dispatch:

concurrency:
  group: b3-trader-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: test -s dashboard/index.html
      - run: test -s dashboard/app.js
      - run: test -s dashboard/plain-language.js
      - run: test -s dashboard/portfolio-tools.js
      - run: test -s dashboard/ux-stability.js
      - run: test -s dashboard/navigation-v3.js
      - run: test -s dashboard/demo-research.js
      - run: test -s dashboard/research-capital.js
      - run: test -s dashboard/research-components.js
      - run: test -s dashboard/strategy-lab-local.js
      - run: test -s dashboard/styles.css
      - run: test -s dashboard/plain-language.css
      - run: test -s dashboard/portfolio-tools.css
      - run: test -s dashboard/ux-polish.css
      - run: test -s dashboard/navigation-v3.css
      - run: test -s dashboard/demo-research.css
      - run: test -s dashboard/research-capital.css
      - run: test -s dashboard/research-components.css
      - run: test -s dashboard/strategy-lab-local.css
      - run: node --check dashboard/app.js
      - run: node --check dashboard/plain-language.js
      - run: node --check dashboard/portfolio-tools.js
      - run: node --check dashboard/ux-stability.js
      - run: node --check dashboard/navigation-v3.js
      - run: node --check dashboard/demo-research.js
      - run: node --check dashboard/research-capital.js
      - run: node --check dashboard/research-components.js
      - run: node --check dashboard/strategy-lab-local.js
      - run: grep -q 'data-view-panel="overview"' dashboard/index.html
      - run: grep -q 'data-view-panel="performance"' dashboard/index.html
      - run: grep -q 'plain-language.js' dashboard/index.html
      - run: grep -q 'portfolio-tools.js' dashboard/index.html
      - run: grep -q 'ux-stability.js' dashboard/index.html
      - run: grep -q 'ux-polish.css' dashboard/index.html
      - run: grep -q 'navigation-v3.js' dashboard/index.html
      - run: grep -q 'navigation-v3.css' dashboard/index.html
      - run: grep -q 'research-capital.js' dashboard/index.html
      - run: grep -q 'research-components.js' dashboard/index.html
      - run: grep -q 'strategy-lab-local.js' dashboard/index.html
      - run: grep -q 'strategy-lab-local.css' dashboard/index.html
      - run: grep -q 'Phone access' dashboard/index.html

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck

  cloudflare-pages-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: find public/modules -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: test -s public/index.html
      - run: test -s public/modules/main.js
      - run: test -s public/modules/core/store.js
      - run: test -s public/modules/shared/charts.js
      - run: test -s public/modules/styles/charts.css
      - run: test -s public/modules/pages/assets.js
      - run: test -s public/modules/pages/research.js
      - run: test -s public/modules/pages/paper.js
      - run: test -s public/modules/pages/strategy.js
      - run: test -s public/modules/pages/records.js
      - run: test -s migrations/0001_init.sql
      - run: grep -q 'READ ONLY' public/index.html
      - run: grep -q 'crypto-viewer-build" content="2026.08.26-26' public/index.html
      - run: grep -q 'type="module" src="/modules/main.js?v=3"' public/index.html
      - run: grep -q '/modules/styles/charts.css?v=1' public/index.html
      - run: grep -q 'data-route="dashboard"' public/index.html
      - run: grep -q 'data-route="research"' public/index.html
      - run: grep -q 'data-route="assets"' public/index.html
      - run: grep -q 'data-route="paper"' public/index.html
      - run: grep -q 'data-route="strategy"' public/index.html
      - run: grep -q 'data-route="records"' public/index.html
      - run: grep -q 'asset-workspace' public/modules/pages/assets.js
      - run: grep -q 'allocation-panel compact' public/modules/pages/assets.js
      - run: grep -q 'research-workspace' public/modules/pages/research.js
      - run: grep -q '현재 조건에서 선택할 코인이 없습니다.' public/modules/pages/research.js
      - run: grep -q 'data-research-range' public/modules/pages/research.js
      - run: grep -q 'scoreHistoryChart' public/modules/pages/research.js
      - run: grep -q 'BTC 시장참고' public/modules/pages/research.js
      - run: grep -q 'ETH 시장참고' public/modules/pages/research.js
      - run: grep -q 'data-paper-range' public/modules/pages/paper.js
      - run: grep -q 'priceFillChart' public/modules/pages/paper.js
      - run: grep -q '최근 중요 변화' public/modules/pages/dashboard.js
      - run: grep -q 'data-records-period' public/modules/pages/records.js
      - run: grep -q 'data-records-search' public/modules/pages/records.js
      - run: grep -q 'data-compare-search' public/modules/pages/paper.js
      - run: grep -q 'data-compare-sort' public/modules/pages/paper.js
      - run: grep -q '전체 PAPER 증감' public/modules/pages/dashboard.js
      - run: if grep -q '/app.js' public/index.html; then exit 1; fi
      - run: if grep -q 'viewer-canonical-' public/index.html; then exit 1; fi
      - run: if grep -q 'exchange-phase3.js' public/index.html; then exit 1; fi
      - run: if grep -q 'records-port.js' public/index.html; then exit 1; fi
      - run: if grep -q 'strategy-lab-v2.js' public/index.html; then exit 1; fi
      - run: grep -q '\[x\] PC 우측 선택 종목 상세' ../docs/VIEWER_REBUILD_CHECKLIST.md
      - run: grep -q 'freqtrade/frequi' ../docs/TRADING_UI_REFERENCE.md
      - run: grep -q 'hummingbot/dashboard' ../docs/TRADING_UI_REFERENCE.md
      - run: grep -q 'marketcalls/openalgo' ../docs/TRADING_UI_REFERENCE.md
      - run: grep -q 'setup-cloudflare-pages-viewer.ps1' README.md
