name: B3 trader tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "TASTES.md"
      - "docs/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "cloudflare/**"
      - "cloudflare-pages/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"
      - ".github/workflows/deploy-pages-viewer.yml"
  workflow_dispatch:

concurrency:
  group: b3-trader-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py scripts/check-viewer-modular.py

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate local dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            dashboard/index.html dashboard/app.js dashboard/plain-language.js dashboard/portfolio-tools.js \
            dashboard/ux-stability.js dashboard/navigation-v3.js dashboard/demo-research.js \
            dashboard/research-capital.js dashboard/research-components.js dashboard/strategy-lab-local.js \
            dashboard/styles.css dashboard/plain-language.css dashboard/portfolio-tools.css dashboard/ux-polish.css \
            dashboard/navigation-v3.css dashboard/demo-research.css dashboard/research-capital.css \
            dashboard/research-components.css dashboard/strategy-lab-local.css; do
            test -s "$file"
          done
          for file in dashboard/*.js; do node --check "$file"; done
          grep -q 'data-view-panel="overview"' dashboard/index.html
          grep -q 'data-view-panel="performance"' dashboard/index.html
          grep -q 'portfolio-tools.js' dashboard/index.html
          grep -q 'Phone access' dashboard/index.html

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck

  cloudflare-pages-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: find public/modules -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate build 29 source contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/index.html public/modules/main.js public/modules/core/store.js \
            public/modules/shared/charts.js public/modules/shared/decision.js public/modules/shared/averaging.js \
            public/modules/services/sectors.js public/modules/pages/dashboard.js public/modules/pages/assets.js \
            public/modules/pages/research.js public/modules/pages/paper.js public/modules/pages/strategy.js \
            public/modules/pages/sectors.js public/modules/pages/records.js public/modules/styles/tokens.css \
            public/modules/styles/assets.css public/modules/styles/paper.css public/modules/styles/sectors.css \
            public/modules/styles/build29.css functions/api/sector-summary.ts migrations/0001_init.sql \
            migrations/0002_market_details.sql migrations/0003_sector_history.sql; do
            test -s "$file"
          done
          grep -q 'READ ONLY' public/index.html
          grep -q 'crypto-viewer-build" content="2026.08.26-29' public/index.html
          grep -q 'type="module" src="/modules/main.js?v=6"' public/index.html
          grep -q 'data-route="sectors"' public/index.html
          grep -q '/modules/styles/build29.css?v=1' public/index.html
          grep -q 'createSectorsPage' public/modules/main.js
          grep -q 'sectorExchange:exchange' public/modules/core/store.js
          grep -q 'allocation-donut' public/modules/pages/dashboard.js
          grep -q '거래소별 시장 상태' public/modules/pages/dashboard.js
          grep -q '전략 유효성' public/modules/pages/dashboard.js
          grep -q 'watch-list scrollable' public/modules/pages/dashboard.js
          grep -q 'refreshLive' public/modules/pages/records.js
          grep -q 'feed.prepend' public/modules/pages/records.js
          grep -q 'records-insight' public/modules/pages/records.js
          grep -q '섹터 순위' public/modules/pages/sectors.js
          grep -q '상승 거래대금 비중' public/modules/pages/sectors.js
          grep -q 'sector_history' functions/api/sector-summary.ts
          grep -q '순입출금액이 아니라' functions/api/sector-summary.ts
          grep -q 'CREATE TABLE IF NOT EXISTS sector_history' migrations/0003_sector_history.sql
          grep -q '.chip-row button.active' public/modules/styles/build29.css
          grep -q '.record-type::before' public/modules/styles/build29.css
          grep -q '.paper-detail-kpis>span:nth-child(3)' public/modules/styles/build29.css
          grep -q '.trade-plan-panel>div>span:nth-child(6)' public/modules/styles/build29.css
          grep -q '@keyframes liveRowIn' public/modules/styles/build29.css
          grep -q 'dashboard/runtime-demo-upbit.json.tmp' ../.gitignore
          grep -q 'dashboard/runtime-demo\*.tmp' ../scripts/repair-local-sync.ps1
          test -s ../TASTES.md
          test -s ../docs/PRIVATE_PORTFOLIO_STORAGE.md
          test -s ../docs/VIEWER_BUILD29_PLAN.md
          grep -q 'AES-256-GCM' ../docs/PRIVATE_PORTFOLIO_STORAGE.md
      - name: Ensure retired Pages UI assets are physically absent
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'app.js' 'asset-local-port.*' 'asset-parity-shell.*' 'exchange-phase3.*' 'local-parity.*' \
            'market-detail.*' 'records-port.*' 'strategy-lab-v1.*' 'strategy-lab-v2.js' 'viewer-best-port.*' \
            'viewer-canonical-v1.*' 'viewer-canonical-v2.*' 'viewer-canonical-v3.*' 'viewer-canonical-v4.*' \
            'viewer-ia-v5.*' 'viewer-performance-v1.*' 'viewer-performance-v2.*' 'viewer-shell-v2.*' \
            'viewer-shell-v3.*' 'viewer-ux-v4.*' 'styles.css' 'workspaces.css'; do
            if compgen -G "public/$pattern" >/dev/null; then
              echo "retired asset still exists: $pattern" >&2
              exit 1
            fi
          done
      - run: grep -q 'setup-cloudflare-pages-viewer.ps1' README.md
