name: B3 trader tests

on:
  pull_request:
    paths:
      - "b3_trader/**"
      - "cloudflare/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/**"
      - "cloudflare/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
