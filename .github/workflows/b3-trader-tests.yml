name: B3 trader tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "TASTES.md"
      - "docs/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "cloudflare/**"
      - "cloudflare-pages/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"
      - ".github/workflows/deploy-pages-viewer.yml"
  workflow_dispatch:

concurrency:
  group: b3-trader-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py scripts/check-viewer-modular.py

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate local dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            dashboard/index.html dashboard/app.js dashboard/plain-language.js dashboard/portfolio-tools.js \
            dashboard/ux-stability.js dashboard/navigation-v3.js dashboard/demo-research.js \
            dashboard/research-capital.js dashboard/research-components.js dashboard/strategy-lab-local.js \
            dashboard/styles.css dashboard/plain-language.css dashboard/portfolio-tools.css dashboard/ux-polish.css \
            dashboard/navigation-v3.css dashboard/demo-research.css dashboard/research-capital.css \
            dashboard/research-components.css dashboard/strategy-lab-local.css; do
            test -s "$file"
          done
          for file in dashboard/*.js; do node --check "$file"; done
          grep -q 'data-view-panel="overview"' dashboard/index.html
          grep -q 'data-view-panel="performance"' dashboard/index.html
          grep -q 'portfolio-tools.js' dashboard/index.html
          grep -q 'Phone access' dashboard/index.html

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck

  cloudflare-pages-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: find public/modules -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate build 30 source contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/index.html public/modules/main.js public/modules/core/router.js public/modules/core/store.js \
            public/modules/shared/charts.js public/modules/shared/decision.js public/modules/shared/averaging.js \
            public/modules/services/sectors.js public/modules/pages/dashboard.js public/modules/pages/research.js \
            public/modules/pages/assets.js public/modules/pages/paper.js public/modules/pages/strategy.js \
            public/modules/pages/sectors.js public/modules/pages/records.js public/modules/styles/build29.css \
            public/modules/styles/exchange-ui.css migrations/0001_init.sql migrations/0003_sector_history.sql; do
            test -s "$file"
          done
          grep -q 'crypto-viewer-build" content="2026.08.26-30' public/index.html
          grep -q 'type="module" src="/modules/main.js?v=7"' public/index.html
          grep -q '/modules/styles/exchange-ui.css?v=1' public/index.html
          grep -q "'sectors'" public/modules/core/router.js
          grep -q 'function patchDashboard' public/modules/pages/dashboard.js
          grep -q "if(m.type==='snapshot')patchDashboard()" public/modules/pages/dashboard.js
          ! grep -q "if(m.type==='snapshot')render()" public/modules/pages/dashboard.js
          grep -q 'data-watch-market' public/modules/pages/dashboard.js
          grep -q 'researchMarket:watch.dataset.watchMarket' public/modules/pages/dashboard.js
          grep -q 'data-sector-jump' public/modules/pages/dashboard.js
          grep -q "navigate('sectors')" public/modules/pages/dashboard.js
          grep -q 'function reconcileSectorFlow' public/modules/pages/dashboard.js
          grep -q 'dashboard-bottom-grid' public/modules/pages/dashboard.js
          grep -q '실시간 요약' public/modules/pages/dashboard.js
          grep -q '@keyframes valueTick' public/modules/styles/exchange-ui.css
          grep -q '.dashboard-bottom-grid' public/modules/styles/exchange-ui.css
          grep -q 'data-sector-market' public/modules/pages/sectors.js
          grep -q "navigate?.('research')" public/modules/pages/sectors.js
          grep -q "'24h'" public/modules/pages/sectors.js
          grep -q 'refreshLive' public/modules/pages/records.js
          grep -q 'feed.prepend' public/modules/pages/records.js
          grep -q 'sector_history' functions/api/sector-summary.ts
          test -s ../docs/VIEWER_BUILD30_PLAN.md
          grep -q 'in-place' ../docs/VIEWER_BUILD30_PLAN.md
      - name: Ensure retired Pages UI assets are physically absent
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'app.js' 'asset-local-port.*' 'asset-parity-shell.*' 'exchange-phase3.*' 'local-parity.*' \
            'market-detail.*' 'records-port.*' 'strategy-lab-v1.*' 'strategy-lab-v2.js' 'viewer-best-port.*' \
            'viewer-canonical-v1.*' 'viewer-canonical-v2.*' 'viewer-canonical-v3.*' 'viewer-canonical-v4.*' \
            'viewer-ia-v5.*' 'viewer-performance-v1.*' 'viewer-performance-v2.*' 'viewer-shell-v2.*' \
            'viewer-shell-v3.*' 'viewer-ux-v4.*' 'styles.css' 'workspaces.css'; do
            if compgen -G "public/$pattern" >/dev/null; then
              echo "retired asset still exists: $pattern" >&2
              exit 1
            fi
          done
      - run: grep -q 'setup-cloudflare-pages-viewer.ps1' README.md
