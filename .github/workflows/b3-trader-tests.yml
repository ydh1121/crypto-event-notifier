name: B3 trader tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "DESIGN.md"
      - "TASTES.md"
      - "docs/**"
      - "b3_trader/**"
      - "control/**"
      - "dashboard/**"
      - "scripts/**"
      - "cloudflare/**"
      - "cloudflare-pages/**"
      - "start-trader.bat"
      - "start-trader-secure.bat"
      - "LOCAL_MULTI_ASSET.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/b3-trader-tests.yml"
      - ".github/workflows/deploy-b3-cloudflare.yml"
      - ".github/workflows/deploy-pages-viewer.yml"
  workflow_dispatch:

concurrency:
  group: b3-trader-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - run: python -m pytest -q b3_trader/tests
      - run: python -m py_compile b3_trader/*.py scripts/check-viewer-modular.py

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate local dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            dashboard/index.html dashboard/app.js dashboard/plain-language.js dashboard/portfolio-tools.js \
            dashboard/ux-stability.js dashboard/navigation-v3.js dashboard/demo-research.js \
            dashboard/research-capital.js dashboard/research-components.js dashboard/strategy-lab-local.js \
            dashboard/styles.css dashboard/plain-language.css dashboard/portfolio-tools.css dashboard/ux-polish.css \
            dashboard/navigation-v3.css dashboard/demo-research.css dashboard/research-capital.css \
            dashboard/research-components.css dashboard/strategy-lab-local.css; do
            test -s "$file"
          done
          for file in dashboard/*.js; do node --check "$file"; done
          grep -q 'data-view-panel="overview"' dashboard/index.html
          grep -q 'data-view-panel="performance"' dashboard/index.html
          grep -q 'portfolio-tools.js' dashboard/index.html
          grep -q 'Phone access' dashboard/index.html

  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck

  cloudflare-pages-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: find public/modules -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate build 28 source contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/index.html public/modules/main.js public/modules/core/store.js \
            public/modules/shared/charts.js public/modules/shared/decision.js public/modules/shared/averaging.js \
            public/modules/styles/tokens.css public/modules/styles/components.css public/modules/styles/assets.css \
            public/modules/styles/paper.css public/modules/pages/assets.js public/modules/pages/research.js \
            public/modules/pages/paper.js public/modules/pages/strategy.js public/modules/pages/records.js \
            migrations/0001_init.sql; do
            test -s "$file"
          done
          grep -q 'READ ONLY' public/index.html
          grep -q 'crypto-viewer-build" content="2026.08.26-28' public/index.html
          grep -q 'type="module" src="/modules/main.js?v=5"' public/index.html
          grep -q '/modules/styles/tokens.css?v=3' public/index.html
          grep -q '/modules/styles/assets.css?v=5' public/index.html
          grep -q '/modules/styles/paper.css?v=5' public/index.html
          grep -q '#f5f5f7' public/modules/styles/tokens.css
          grep -q '#1d1d1f' public/modules/styles/tokens.css
          grep -q '#0066cc' public/modules/styles/tokens.css
          grep -q 'tabular-nums' public/modules/styles/tokens.css
          grep -q 'white-space:nowrap' public/modules/styles/components.css
          grep -q '.chip-row button.active' public/modules/styles/components.css
          grep -q '.asset-research-sides .score-line+.score-line' public/modules/styles/assets.css
          grep -q '.exchange-paper-grid .kpi b' public/modules/styles/paper.css
          grep -q '추천 타점 · 즉시 평단' public/modules/pages/assets.js
          grep -q 'data-direct-buy-price' public/modules/pages/assets.js
          grep -q '물타기 계산기' public/modules/pages/assets.js
          grep -q 'data-add-avg-row' public/modules/pages/assets.js
          grep -q 'calculateDirectAverage' public/modules/shared/averaging.js
          grep -q 'calculateAveraging' public/modules/shared/averaging.js
          grep -q 'researchExchange:exchange' public/modules/core/store.js
          grep -q 'strategyExchange:exchange' public/modules/core/store.js
          grep -q 'recordsExchange:exchange' public/modules/core/store.js
          grep -q 'row?.exchange||' public/modules/core/store.js
          grep -q '../shared/decision.js' public/modules/pages/research.js
          grep -q 'data-research-range' public/modules/pages/research.js
          grep -q 'data-paper-range' public/modules/pages/paper.js
          grep -q 'data-records-period' public/modules/pages/records.js
          grep -q 'data-records-search' public/modules/pages/records.js
          test -s ../TASTES.md
          test -s ../docs/PRIVATE_PORTFOLIO_STORAGE.md
          grep -q 'AES-256-GCM' ../docs/PRIVATE_PORTFOLIO_STORAGE.md
      - name: Ensure retired Pages UI assets are physically absent
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'app.js' 'asset-local-port.*' 'asset-parity-shell.*' 'exchange-phase3.*' 'local-parity.*' \
            'market-detail.*' 'records-port.*' 'strategy-lab-v1.*' 'strategy-lab-v2.js' 'viewer-best-port.*' \
            'viewer-canonical-v1.*' 'viewer-canonical-v2.*' 'viewer-canonical-v3.*' 'viewer-canonical-v4.*' \
            'viewer-ia-v5.*' 'viewer-performance-v1.*' 'viewer-performance-v2.*' 'viewer-shell-v2.*' \
            'viewer-shell-v3.*' 'viewer-ux-v4.*' 'styles.css' 'workspaces.css'; do
            if compgen -G "public/$pattern" >/dev/null; then
              echo "retired asset still exists: $pattern" >&2
              exit 1
            fi
          done
      - run: grep -q 'setup-cloudflare-pages-viewer.ps1' README.md
