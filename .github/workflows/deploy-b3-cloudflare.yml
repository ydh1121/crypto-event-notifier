name: Deploy B3 trader to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy-paper:
    runs-on: ubuntu-latest
    environment: b3-paper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B3_ADMIN_TOKEN: ${{ secrets.B3_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$B3_ADMIN_TOKEN"

      - name: Install Cloudflare deployment dependencies
        working-directory: cloudflare
        run: npm install

      - name: Typecheck Worker
        working-directory: cloudflare
        run: npm run typecheck

      - name: Configure admin secret
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B3_ADMIN_TOKEN: ${{ secrets.B3_ADMIN_TOKEN }}
        run: printf '%s' "$B3_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Deploy Worker and Container
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
