name: B3 DEX Cloud Projection Build 44

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/dex_launch_snapshot.py"
      - "b3_trader/cloudflare_snapshot_lifecycle.py"
      - "b3_trader/cloudflare_snapshot_budget.py"
      - "b3_trader/tests/test_dex_launch_snapshot.py"
      - "cloudflare-pages/public/modules/main.js"
      - "cloudflare-pages/public/modules/pages/dex-launch-panel.js"
      - "scripts/check-dex-build42.py"
      - "scripts/check-dex-supervisor-build43.py"
      - "scripts/check-dex-cloud-projection-build44.py"
      - "scripts/verify-dex-cloud-projection-build44.py"
      - ".github/workflows/b3-dex-cloud-projection-build44.yml"
  workflow_dispatch:

jobs:
  build44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile compact DEX projection
        run: >-
          python -m py_compile
          b3_trader/dex_launch_snapshot.py
          b3_trader/cloudflare_snapshot_lifecycle.py
          scripts/check-dex-build42.py
          scripts/check-dex-supervisor-build43.py
          scripts/check-dex-cloud-projection-build44.py
          scripts/verify-dex-cloud-projection-build44.py
      - name: DEX snapshot unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_launch_snapshot.py b3_trader/tests/test_cloudflare_snapshot_budget.py
      - name: Viewer module syntax
        run: node --check cloudflare-pages/public/modules/pages/dex-launch-panel.js && node --check cloudflare-pages/public/modules/main.js
      - name: Build 42 regression contract
        run: python scripts/check-dex-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 projection contract
        run: python scripts/check-dex-cloud-projection-build44.py
