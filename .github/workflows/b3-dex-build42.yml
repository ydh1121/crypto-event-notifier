name: B3 DEX Build 42

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/dex_launch_sources.py"
      - "b3_trader/dex_launch_store.py"
      - "b3_trader/dex_launch_features.py"
      - "b3_trader/dex_launch_research_cycle.py"
      - "b3_trader/dex_launch_audit.py"
      - "b3_trader/tests/test_dex_launch_build42.py"
      - "scripts/check-dex-build42.py"
      - "scripts/verify-dex-build42.py"
      - ".github/workflows/b3-dex-build42.yml"
  workflow_dispatch:

jobs:
  build42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile DEX research
        run: >-
          python -m py_compile
          b3_trader/dex_launch_sources.py
          b3_trader/dex_launch_store.py
          b3_trader/dex_launch_features.py
          b3_trader/dex_launch_research_cycle.py
          b3_trader/dex_launch_audit.py
          scripts/check-dex-build42.py
          scripts/verify-dex-build42.py
      - name: DEX research tests
        run: python -m pytest -q b3_trader/tests/test_dex_launch_build42.py
      - name: Build 42 contract
        run: python scripts/check-dex-build42.py
      - name: Empty local verifier
        run: python scripts/verify-dex-build42.py
