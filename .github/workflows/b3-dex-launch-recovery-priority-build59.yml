name: B3 DEX Launch Recovery Priority Build 59

on:
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/dex_launch_recovery_priority.py"
      - "b3_trader/tests/test_dex_launch_recovery_priority_build59.py"
      - "scripts/check-dex-launch-recovery-priority-build59.py"
      - "scripts/verify-dex-launch-recovery-priority-build59.py"
      - ".github/workflows/b3-dex-launch-recovery-priority-build59.yml"
  pull_request:
    branches:
      - master
    paths:
      - "b3_trader/dex_launch_recovery_priority.py"
      - "b3_trader/tests/test_dex_launch_recovery_priority_build59.py"
      - "scripts/check-dex-launch-recovery-priority-build59.py"
      - "scripts/verify-dex-launch-recovery-priority-build59.py"
      - ".github/workflows/b3-dex-launch-recovery-priority-build59.yml"

jobs:
  build59:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile Build 59
        run: >-
          python -m py_compile
          b3_trader/dex_launch_recovery_priority.py
          scripts/check-dex-launch-recovery-priority-build59.py
          scripts/verify-dex-launch-recovery-priority-build59.py
      - name: Direct Build 59 verifier import bootstrap
        run: python scripts/verify-dex-launch-recovery-priority-build59.py --import-check
      - name: Build 59 priority unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_launch_recovery_priority_build59.py
      - name: Build 53 regression contract
        run: python scripts/check-dex-shadow-readiness-build53.py
      - name: Build 54 regression contract
        run: python scripts/check-dex-shadow-remediation-build54.py
      - name: Build 55 regression contract
        run: python scripts/check-dex-shadow-remediation-runner-build55.py
      - name: Build 56 regression contract
        run: python scripts/check-dex-temporal-backfill-build56.py
      - name: Build 57 regression contract
        run: python scripts/check-dex-temporal-diversity-build57.py
      - name: Build 58 regression contract
        run: python scripts/check-temporal-identity-preparation-build58.py
      - name: Build 59 launch recovery priority contract
        run: python scripts/check-dex-launch-recovery-priority-build59.py
