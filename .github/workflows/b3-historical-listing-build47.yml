name: B3 Historical Listing Build 47

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/historical_listing_backfill.py"
      - "b3_trader/tests/test_historical_listing_backfill.py"
      - "scripts/check-historical-listing-build47.py"
      - "scripts/verify-historical-listing-build47.py"
      - "scripts/check-dex-build42.py"
      - "scripts/check-dex-supervisor-build43.py"
      - "scripts/check-dex-cloud-projection-build44.py"
      - "scripts/check-dex-quality-build45.py"
      - "scripts/check-dex-backfill-build46.py"
      - ".github/workflows/b3-historical-listing-build47.yml"
  workflow_dispatch:

jobs:
  build47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile historical listing backfill
        run: >-
          python -m py_compile
          b3_trader/historical_listing_backfill.py
          scripts/check-historical-listing-build47.py
          scripts/verify-historical-listing-build47.py
      - name: Direct historical verifier import bootstrap
        run: python scripts/verify-historical-listing-build47.py --import-check
      - name: Historical listing unit tests
        run: python -m pytest -q b3_trader/tests/test_historical_listing_backfill.py
      - name: Build 42 regression contract
        run: python scripts/check-dex-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 regression contract
        run: python scripts/check-dex-cloud-projection-build44.py
      - name: Build 45 regression contract
        run: python scripts/check-dex-quality-build45.py
      - name: Build 46 regression contract
        run: python scripts/check-dex-backfill-build46.py
      - name: Build 47 historical listing contract
        run: python scripts/check-historical-listing-build47.py
