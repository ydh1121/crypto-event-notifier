name: B3 DEX Shadow Score Failure Diagnostic Build 64
on:
  push:
    branches: [b3-auto-trader-phase1]
    paths:
      - "b3_trader/dex_shadow_score_failure_diagnostic.py"
      - "b3_trader/tests/test_dex_shadow_score_failure_diagnostic_build64.py"
      - "scripts/check-dex-shadow-score-failure-diagnostic-build64.py"
      - "scripts/verify-dex-shadow-score-failure-diagnostic-build64.py"
      - ".github/workflows/b3-dex-shadow-score-failure-diagnostic-build64.yml"
  pull_request:
    branches: [master]
    paths:
      - "b3_trader/dex_shadow_score_failure_diagnostic.py"
      - "b3_trader/tests/test_dex_shadow_score_failure_diagnostic_build64.py"
      - "scripts/check-dex-shadow-score-failure-diagnostic-build64.py"
      - "scripts/verify-dex-shadow-score-failure-diagnostic-build64.py"
      - ".github/workflows/b3-dex-shadow-score-failure-diagnostic-build64.yml"
jobs:
  build64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile Build 64
        run: python -m py_compile b3_trader/dex_shadow_score_failure_diagnostic.py scripts/check-dex-shadow-score-failure-diagnostic-build64.py scripts/verify-dex-shadow-score-failure-diagnostic-build64.py
      - name: Direct Build 64 verifier import bootstrap
        run: python scripts/verify-dex-shadow-score-failure-diagnostic-build64.py --import-check
      - name: Build 64 diagnostic unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_shadow_score_failure_diagnostic_build64.py
      - name: Build 53 regression contract
        run: python scripts/check-dex-shadow-readiness-build53.py
      - name: Build 62 regression contract
        run: python scripts/check-dex-shadow-score-build62.py
      - name: Build 63 regression contract
        run: python scripts/check-dex-shadow-score-validation-build63.py
      - name: Build 64 failure diagnostic contract
        run: python scripts/check-dex-shadow-score-failure-diagnostic-build64.py
