name: B3 DEX Backfill Build 46

on:
  push:
    branches:
      - "b3-auto-trader-phase1"
    paths:
      - "b3_trader/dex_launch_backfill.py"
      - "b3_trader/tests/test_dex_launch_backfill.py"
      - "b3_trader/dex_launch_quality.py"
      - "b3_trader/dex_launch_research_cycle.py"
      - "scripts/check-dex-build42.py"
      - "scripts/check-dex-supervisor-build43.py"
      - "scripts/check-dex-cloud-projection-build44.py"
      - "scripts/check-dex-quality-build45.py"
      - "scripts/check-dex-backfill-build46.py"
      - "scripts/verify-dex-backfill-build46.py"
      - ".github/workflows/b3-dex-backfill-build46.yml"
  workflow_dispatch:

jobs:
  build46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile bounded backfill
        run: >-
          python -m py_compile
          b3_trader/dex_launch_backfill.py
          scripts/check-dex-backfill-build46.py
          scripts/verify-dex-backfill-build46.py
      - name: Direct backfill verifier import bootstrap
        run: python scripts/verify-dex-backfill-build46.py --import-check
      - name: DEX backfill unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_launch_backfill.py b3_trader/tests/test_dex_launch_quality.py b3_trader/tests/test_dex_launch_snapshot.py
      - name: Build 42 regression contract
        run: python scripts/check-dex-build42.py
      - name: Build 43 regression contract
        run: python scripts/check-dex-supervisor-build43.py
      - name: Build 44 regression contract
        run: python scripts/check-dex-cloud-projection-build44.py
      - name: Build 45 regression contract
        run: python scripts/check-dex-quality-build45.py
      - name: Build 46 backfill contract
        run: python scripts/check-dex-backfill-build46.py
