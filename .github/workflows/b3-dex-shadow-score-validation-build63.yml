name: B3 DEX Shadow Score Validation Build 63

on:
  push:
    branches:
      - b3-auto-trader-phase1
    paths:
      - "b3_trader/dex_shadow_score_validation.py"
      - "b3_trader/tests/test_dex_shadow_score_validation_build63.py"
      - "scripts/check-dex-shadow-score-validation-build63.py"
      - "scripts/verify-dex-shadow-score-validation-build63.py"
      - ".github/workflows/b3-dex-shadow-score-validation-build63.yml"
  pull_request:
    branches:
      - master
    paths:
      - "b3_trader/dex_shadow_score_validation.py"
      - "b3_trader/tests/test_dex_shadow_score_validation_build63.py"
      - "scripts/check-dex-shadow-score-validation-build63.py"
      - "scripts/verify-dex-shadow-score-validation-build63.py"
      - ".github/workflows/b3-dex-shadow-score-validation-build63.yml"

jobs:
  build63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r b3_trader/requirements.txt pytest
      - name: Compile Build 63
        run: >-
          python -m py_compile
          b3_trader/dex_shadow_score_validation.py
          scripts/check-dex-shadow-score-validation-build63.py
          scripts/verify-dex-shadow-score-validation-build63.py
      - name: Direct Build 63 verifier import bootstrap
        run: python scripts/verify-dex-shadow-score-validation-build63.py --import-check
      - name: Build 63 validation unit tests
        run: python -m pytest -q b3_trader/tests/test_dex_shadow_score_validation_build63.py
      - name: Build 53 regression contract
        run: python scripts/check-dex-shadow-readiness-build53.py
      - name: Build 61 regression contract
        run: python scripts/check-dex-alternate-launch-probe-build61.py
      - name: Build 62 regression contract
        run: python scripts/check-dex-shadow-score-build62.py
      - name: Build 63 validation contract
        run: python scripts/check-dex-shadow-score-validation-build63.py
