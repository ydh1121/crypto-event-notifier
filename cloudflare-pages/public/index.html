<body>
  <section id="authView" class="auth-wrap">
    <button type="button" class="auth-theme-toggle" data-theme-toggle aria-pressed="false">어둡게</button>
    <article class="auth-card" id="loginCard">
      <h1>코인 현황</h1>
      <p>등록된 계정으로 로그인하세요.</p>
      <form id="loginForm">
        <label>이메일<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" minlength="10" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <button id="showBootstrapBtn" class="text-button" type="button">처음 설정</button>
    </article>
    <article class="auth-card hidden" id="bootstrapCard">
      <h1>관리자 계정 만들기</h1>
      <p>처음 한 번만 설정합니다.</p>
      <form id="bootstrapForm">
        <label>이름<input id="bootstrapName" autocomplete="name" value="관리자"></label>
        <label>이메일<input id="bootstrapEmail" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="bootstrapPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <label>설정용 키<input id="bootstrapToken" type="password" autocomplete="off" required></label>
        <button class="primary" type="submit">계정 만들기</button>
      </form>
      <button id="showLoginBtn" class="text-button" type="button">로그인으로 돌아가기</button>
    </article>
    <article class="auth-card hidden" id="inviteCard">
      <h1>초대받은 계정 만들기</h1>
      <p>이름과 비밀번호를 정하면 시작할 수 있습니다.</p>
      <form id="inviteForm">
        <label>이름<input id="inviteName" autocomplete="name" required></label>
        <label>비밀번호<input id="invitePassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="primary" type="submit">계정 만들기</button>
      </form>
    </article>
  </section>

  <section id="appShell" class="app-shell hidden">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand"><strong>코인 현황</strong></div>
        <nav id="mainNav" class="main-nav" aria-label="주요 메뉴">
          <button data-route="dashboard" class="active">홈</button>
          <button data-route="research">코인</button>
          <button data-route="assets">내 자산</button>
          <button data-route="paper">모의투자</button>
          <button data-route="records">거래내역</button>
          <button data-route="system">더보기</button>
        </nav>
        <div class="header-tools">
          <div id="readerModeControl" class="reader-mode-control" role="group" aria-label="화면 정보량">
            <button type="button" data-reader-mode="simple" class="active" aria-pressed="true">기본</button>
            <button type="button" data-reader-mode="detail" aria-pressed="false">상세</button>
          </div>
          <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">어둡게</button>
          <button id="userMenuBtn" class="user-menu"><span>사용자</span><small>계정</small></button>
          <button id="logoutBtn" class="logout">로그아웃</button>
        </div>
      </div>
      <nav id="journeyNav" class="journey-nav hidden" aria-label="세부 메뉴"></nav>
    </header>
    <main id="pageRoot" class="app-main"></main>
  </section>

  <script type="module" src="/modules/main.js?v=88"></script>
</body>
</html>
