<!doctype html>
<html lang="ko" data-reader-mode="simple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="crypto-viewer-build" content="2026.09.06-v3">
  <title>가상자산 상태판</title>
  <link rel="stylesheet" href="/modules/styles/rebuild-v3.css?v=1">
</head>
<body>
  <section id="authView" class="auth-wrap">
    <article class="auth-card" id="loginCard">
      <span class="readonly-badge">조회 전용</span>
      <h1>가상자산 상태판</h1>
      <p>등록된 계정으로 로그인하세요.</p>
      <form id="loginForm">
        <label>이메일<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" minlength="10" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <button id="showBootstrapBtn" class="text-button" type="button">처음 설정</button>
    </article>
    <article class="auth-card hidden" id="bootstrapCard">
      <span class="readonly-badge">처음 설정</span>
      <h1>관리자 계정 만들기</h1>
      <p>처음 한 번만 관리자 계정을 만듭니다.</p>
      <form id="bootstrapForm">
        <label>이름<input id="bootstrapName" autocomplete="name" value="관리자"></label>
        <label>이메일<input id="bootstrapEmail" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="bootstrapPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <label>관리자 생성 키<input id="bootstrapToken" type="password" autocomplete="off" required></label>
        <button class="primary" type="submit">계정 만들기</button>
      </form>
      <button id="showLoginBtn" class="text-button" type="button">로그인으로 돌아가기</button>
    </article>
    <article class="auth-card hidden" id="inviteCard">
      <span class="readonly-badge">초대 계정</span>
      <h1>초대받은 계정 만들기</h1>
      <p>이름과 비밀번호를 정하면 바로 시작할 수 있습니다.</p>
      <form id="inviteForm">
        <label>이름<input id="inviteName" autocomplete="name" required></label>
        <label>비밀번호<input id="invitePassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="primary" type="submit">계정 만들기</button>
      </form>
    </article>
  </section>

  <section id="appShell" class="app-shell hidden">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="#" onclick="return false"><strong>가상자산 상태판</strong><span>조회 전용</span></a>
        <nav id="mainNav" class="main-nav" aria-label="주요 화면">
          <button data-route="dashboard" class="active">홈</button>
          <button data-route="research">코인 찾기</button>
          <button data-route="sectors">종류별 보기</button>
          <button data-route="assets">내 코인</button>
          <button data-route="paper">가상매매</button>
          <button data-route="records">기록</button>
        </nav>
        <div class="header-tools">
          <div id="readerModeControl" class="reader-mode-control" role="group" aria-label="화면 정보량">
            <button type="button" data-reader-mode="simple" class="active" aria-pressed="true">간단히</button>
            <button type="button" data-reader-mode="detail" aria-pressed="false">자세히</button>
          </div>
          <button id="systemStatusBtn" class="utility-status neutral">연결 상태</button>
          <button id="userMenuBtn" class="user-menu"><span>사용자</span><small>조회</small></button>
          <button id="logoutBtn" class="logout">로그아웃</button>
        </div>
      </div>
      <nav id="journeyNav" class="journey-nav hidden" aria-label="현재 화면의 상세 메뉴"></nav>
    </header>
    <main id="pageRoot" class="app-main"></main>
  </section>

  <script type="module" src="/modules/main.js?v=70"></script>
</body>
</html>
