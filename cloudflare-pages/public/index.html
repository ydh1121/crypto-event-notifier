<body>
  <section id="authView" class="auth-wrap">
    <article class="auth-card" id="loginCard"><span class="readonly-badge">READ ONLY PAPER</span><h2>Crypto Research</h2><p>조회 계정으로 로그인합니다.</p><form id="loginForm"><label>이메일<input id="loginEmail" type="email" autocomplete="username" required></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" minlength="10" required></label><button class="primary" type="submit">로그인</button></form><button id="showBootstrapBtn" class="text-button" type="button">처음 관리자 계정 만들기</button></article>
    <article class="auth-card hidden" id="bootstrapCard"><span class="readonly-badge">FIRST SETUP</span><h2>첫 관리자 만들기</h2><p>관리자 생성 키는 계정을 만든 뒤 평소 사용하지 않습니다.</p><form id="bootstrapForm"><label>표시 이름<input id="bootstrapName" autocomplete="name" value="Owner"></label><label>이메일<input id="bootstrapEmail" type="email" autocomplete="username" required></label><label>비밀번호<input id="bootstrapPassword" type="password" minlength="10" autocomplete="new-password" required></label><label>관리자 생성 키<input id="bootstrapToken" type="password" autocomplete="off" required></label><button class="primary" type="submit">관리자 계정 만들기</button></form><button id="showLoginBtn" class="text-button" type="button">로그인으로 돌아가기</button></article>
    <article class="auth-card hidden" id="inviteCard"><span class="readonly-badge">INVITE</span><h2>초대받은 계정 만들기</h2><p>초대 링크를 확인했습니다.</p><form id="inviteForm"><label>표시 이름<input id="inviteName" autocomplete="name" required></label><label>비밀번호<input id="invitePassword" type="password" minlength="10" autocomplete="new-password" required></label><button class="primary" type="submit">계정 만들고 시작</button></form></article>
  </section>
  <section id="appShell" class="app-shell hidden">
    <header class="app-header"><div class="app-header-inner">
      <div class="brand"><strong>Crypto Research</strong><span>PAPER RESEARCH</span></div>
      <nav id="mainNav" class="main-nav" aria-label="주요 화면"><button data-route="dashboard" class="active">대시보드</button><button data-route="research">리서치</button><button data-route="assets">자산</button><button data-route="paper">PAPER</button><button data-route="strategy">전략 연구</button><button data-route="sectors">섹터</button><button data-route="records">기록</button></nav>
      <div class="header-tools"><button id="systemStatusBtn" class="utility-status neutral">● 연결 확인</button><button id="userMenuBtn" class="user-menu"><span>사용자</span><small>조회</small></button><button id="logoutBtn" class="logout">로그아웃</button></div>
    </div></header>
    <main id="pageRoot" class="app-main"></main>
  </section>
